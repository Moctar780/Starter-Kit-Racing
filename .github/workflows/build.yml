name: Build

on:
  push:
    branches:
      - version_2
      - main
      - master
  pull_request:
    branches:
      - version_2
      - main
      - master

env:
  MINISERVE_VERSION: v0.35.0
  MINISERVE_URL: https://github.com/svenstaro/miniserve/releases/download/v0.35.0/miniserve-0.35.0-x86_64-pc-windows-msvc.exe

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment files
        shell: bash
        run: |
          test -f index.html
          test -f blockly.html
          test -f editor.html
          test -f js/main.js
          test -f vendor/three.module.js
          test -d node_modules/blockly

      - name: Docker build (Sliplane)
        if: matrix.os == 'ubuntu-latest'
        run: docker build -t starter-kit-racing:ci .

      - name: Create Windows offline package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist/windows'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $folders = @('js', 'vendor', 'models', 'audio', 'sprites', 'node_modules')
          foreach ( $folder in $folders ) {
            Copy-Item -Recurse -Force $folder (Join-Path $root $folder)
          }

          $files = @(
            'index.html',
            'blockly.html',
            'editor.html',
            'package.json',
            'package-lock.json'
          )
          foreach ( $file in $files ) {
            Copy-Item -Force $file (Join-Path $root $file)
          }

          Invoke-WebRequest -Uri $env:MINISERVE_URL -OutFile (Join-Path $root 'Hakilidia-Racing.exe')
          Copy-Item -Force 'scripts/start-windows.bat' (Join-Path $root 'start.bat')

          if ( -not (Test-Path (Join-Path $root 'Hakilidia-Racing.exe')) ) {
            throw 'Hakilidia-Racing.exe was not created.'
          }

          Compress-Archive -Path (Join-Path $root '*') -DestinationPath starter-kit-racing-windows.zip -Force

      - name: Upload Windows package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: starter-kit-racing-windows
          path: starter-kit-racing-windows.zip
          retention-days: 14
