<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<title>Hakilidia-blockly</title>
	<style>
		:root {
			--ui-pad: 12px;
		}
		body {
			margin: 0;
			overflow: hidden;
			background: #000;
			padding: env( safe-area-inset-top ) env( safe-area-inset-right ) env( safe-area-inset-bottom ) env( safe-area-inset-left );
		}
		canvas { display: block; touch-action: none; }
		.corner-link,
		.corner-btn {
			position: fixed;
			color: #1f2430;
			font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			background: rgba(255,255,255,0.92);
			padding: 10px 14px;
			border-radius: 999px;
			border: 1px solid rgba(0,0,0,0.06);
			box-shadow: 0 4px 14px rgba(0,0,0,0.18);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			z-index: 20;
			transition: background 0.15s;
		}
		.corner-link {
			text-decoration: none;
		}
		.corner-btn {
			cursor: pointer;
		}
		.corner-link:hover,
		.corner-btn:hover { background: #fff; }
		#reset-btn {
			top: calc( var( --ui-pad ) + env( safe-area-inset-top, 0px ) );
			left: calc( var( --ui-pad ) + env( safe-area-inset-left, 0px ) );
		}
		#editor-link {
			bottom: calc( var( --ui-pad ) + env( safe-area-inset-bottom, 0px ) );
			right: calc( var( --ui-pad ) + env( safe-area-inset-right, 0px ) );
		}
		#blockly-link {
			bottom: calc( var( --ui-pad ) + env( safe-area-inset-bottom, 0px ) );
			left: calc( var( --ui-pad ) + env( safe-area-inset-left, 0px ) );
		}
		#github-link {
			top: calc( var( --ui-pad ) + env( safe-area-inset-top, 0px ) );
			right: calc( var( --ui-pad ) + env( safe-area-inset-right, 0px ) );
			padding: 8px;
			line-height: 0;
		}
		#github-link svg { display: block; width: 20px; height: 20px; }
		#loading {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 14px;
			background: #adb2ba;
			z-index: 30;
			transition: opacity 0.35s ease, visibility 0.35s ease;
		}
		#loading.hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}
		#loading-label {
			color: #1f2430;
			font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
		}
		#loading-bar-track {
			width: min( 280px, 70vw );
			height: 4px;
			border-radius: 999px;
			background: rgba( 31, 36, 48, 0.12 );
			overflow: hidden;
		}
		#loading-bar {
			width: 0%;
			height: 100%;
			border-radius: inherit;
			background: #1f2430;
			transition: width 0.15s ease;
		}
		@media ( max-width: 800px ) {
			:root { --ui-pad: 8px; }
			.corner-link,
			.corner-btn {
				padding: 9px 12px;
				font-size: 11px;
				max-width: calc( 50vw - 20px );
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			#github-link {
				padding: 7px;
			}
			#github-link svg {
				width: 18px;
				height: 18px;
			}
		}
	</style>
	<link rel="preload" href="models/vehicle-truck-yellow.glb" as="fetch" crossorigin>
	<link rel="preload" href="models/track-straight.glb" as="fetch" crossorigin>
	<link rel="preload" href="models/track-corner.glb" as="fetch" crossorigin>
	<link rel="preload" href="models/Textures/colormap.png" as="image">
	<script type="importmap">
	{
		"imports": {
			"three": "./vendor/three.module.js",
			"three/addons/": "./vendor/three/addons/",
			"crashcat": "./vendor/crashcat/index.js",
			"mathcat": "./vendor/mathcat/index.js"
		}
	}
	</script>
</head>
<body>
	<div id="loading" aria-live="polite" aria-busy="true">
		<div id="loading-bar-track"><div id="loading-bar"></div></div>
		<div id="loading-label">Loading…</div>
	</div>
	<button id="reset-btn" class="corner-btn" type="button">Reset</button>
	<a id="github-link" class="corner-link" href="https://github.com/mrdoob/Starter-Kit-Racing" aria-label="View source on GitHub">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.05c-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18.92-.26 1.91-.39 2.89-.39.98 0 1.97.13 2.89.39 2.21-1.5 3.18-1.18 3.18-1.18.62 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.79.56C20.21 21.39 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
	</a>
	<a id="blockly-link" class="corner-link" href="blockly.html">Programmer</a>
	<a id="editor-link" class="corner-link" href="editor.html">Create new track</a>
	<script>
		window.RacingDeviceProfile = ( function () {

			try {

				if ( window.SparkiAndroid?.getDeviceProfileJson ) {

					return JSON.parse( window.SparkiAndroid.getDeviceProfileJson() );

				}

			} catch ( error ) {

				console.warn( 'Device profile unavailable', error );

			}

			return null;

		} )();

		const map = new URLSearchParams( location.search ).get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + map;
			link.textContent = 'Edit this track';
			document.getElementById( 'blockly-link' ).href = 'blockly.html?map=' + map;
		}
	</script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
